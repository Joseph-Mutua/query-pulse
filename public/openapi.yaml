openapi: 3.1.0
info:
  title: QueryPulse API
  version: 1.0.0
  description: Configure search monitors and investigate runs, diffs, incidents, and reliability metrics.
servers:
  - url: /api/v1
tags:
  - name: Monitors
  - name: Runs
  - name: Incidents
  - name: Operations
paths:
  /monitors:
    get:
      tags: [Monitors]
      summary: List monitors
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated monitors
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitorCollection' }
    post:
      tags: [Monitors]
      summary: Create a monitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monitor]
              properties: { monitor: { $ref: '#/components/schemas/MonitorInput' } }
            example:
              monitor:
                name: GitHub Ruby Results
                engine: fake
                query: 'site:github.com "ruby scraper"'
                location: Austin, Texas
                language: en
                country: us
                device: desktop
                frequency: 15m
                assertions: { minimum_results: 5, required_domains: [github.com] }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/MonitorResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /monitors/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Monitors]
      summary: Get a monitor
      responses:
        '200': { description: Monitor detail, content: { application/json: { schema: { $ref: '#/components/schemas/MonitorResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Monitors]
      summary: Update a monitor
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [monitor], properties: { monitor: { $ref: '#/components/schemas/MonitorInput' } } }
      responses:
        '200': { description: Updated monitor, content: { application/json: { schema: { $ref: '#/components/schemas/MonitorResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Monitors]
      summary: Delete a monitor and its history
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /monitors/{id}/run:
    post:
      tags: [Runs]
      summary: Queue a manual execution
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '202': { description: Run accepted, content: { application/json: { schema: { $ref: '#/components/schemas/RunResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /monitors/{id}/runs:
    get:
      tags: [Runs]
      summary: List a monitor's runs
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Paginated runs, content: { application/json: { schema: { $ref: '#/components/schemas/RunCollection' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /runs/{id}:
    get:
      tags: [Runs]
      summary: Inspect a run including raw and normalized payloads
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Run detail, content: { application/json: { schema: { $ref: '#/components/schemas/RunResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /runs/{id}/diff:
    get:
      tags: [Runs]
      summary: Read structured changes from the previous run
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Structured diff
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      run_id: { type: string }
                      previous_run_id: { type: [string, 'null'] }
                      schema_changed: { type: boolean }
                      changes: { type: array, items: { $ref: '#/components/schemas/Change' } }
                      summary: { type: object, additionalProperties: { type: integer } }
        '404': { $ref: '#/components/responses/NotFound' }
  /incidents:
    get:
      tags: [Incidents]
      summary: List incidents
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: status, in: query, schema: { type: string, enum: [open, acknowledged, resolved] } }
        - { name: severity, in: query, schema: { type: string, enum: [info, warning, critical] } }
        - { name: monitor_id, in: query, schema: { type: string } }
      responses:
        '200': { description: Paginated incidents, content: { application/json: { schema: { $ref: '#/components/schemas/IncidentCollection' } } } }
  /incidents/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Incidents]
      summary: Get incident detail
      responses:
        '200': { description: Incident detail, content: { application/json: { schema: { $ref: '#/components/schemas/IncidentResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Incidents]
      summary: Acknowledge or resolve an incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [incident]
              properties:
                incident:
                  type: object
                  required: [status]
                  properties: { status: { type: string, enum: [open, acknowledged, resolved] } }
      responses:
        '200': { description: Updated incident, content: { application/json: { schema: { $ref: '#/components/schemas/IncidentResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /metrics:
    get:
      tags: [Operations]
      summary: Calculate reliability metrics from persisted records
      parameters:
        - { name: window, in: query, schema: { type: string, enum: [1h, 24h, 7d], default: 24h } }
        - { name: monitor_id, in: query, schema: { type: string } }
      responses:
        '200': { description: Metrics, content: { application/json: { schema: { $ref: '#/components/schemas/MetricsResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /health:
    get:
      tags: [Operations]
      summary: Check MongoDB, Redis, and background processing availability
      responses:
        '200': { description: Dependencies healthy, content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } } }
        '503': { description: At least one dependency is unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } } }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string }, description: MongoDB ObjectId }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PerPage: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
  responses:
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ValidationError: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    RateLimited: { description: Execution rate limit exceeded, headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    Pagination:
      type: object
      required: [page, per_page, total, total_pages]
      properties: { page: { type: integer }, per_page: { type: integer }, total: { type: integer }, total_pages: { type: integer } }
    MonitorInput:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        engine: { type: string, enum: [google, bing, fake] }
        query: { type: string, maxLength: 500 }
        location: { type: [string, 'null'] }
        language: { type: string, examples: [en] }
        country: { type: string, examples: [us] }
        device: { type: string, enum: [desktop, mobile, tablet] }
        frequency: { type: string, enum: [5m, 15m, 30m, 1h, 6h, 12h, 24h] }
        enabled: { type: boolean }
        tags: { type: array, items: { type: string } }
        assertions: { type: object, additionalProperties: true }
    Monitor:
      allOf:
        - $ref: '#/components/schemas/MonitorInput'
        - type: object
          required: [id, name, query, engine, frequency, enabled]
          properties:
            id: { type: string }
            next_execution_at: { type: [string, 'null'], format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            latest_run: { oneOf: [{ $ref: '#/components/schemas/Run' }, { type: 'null' }] }
            open_incident_count: { type: integer }
    MonitorResponse: { type: object, properties: { data: { $ref: '#/components/schemas/Monitor' } } }
    MonitorCollection: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Monitor' } }, pagination: { $ref: '#/components/schemas/Pagination' } } }
    Run:
      type: object
      required: [id, monitor_id, status]
      properties:
        id: { type: string }
        monitor_id: { type: string }
        status: { type: string, enum: [pending, running, success, failed, timeout, invalid_response] }
        engine: { type: [string, 'null'] }
        provider: { type: [string, 'null'] }
        started_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        http_status: { type: [integer, 'null'] }
        response_time_ms: { type: [integer, 'null'] }
        result_count: { type: integer }
        schema_fingerprint: { type: [string, 'null'] }
        relevance_score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        error_type: { type: [string, 'null'] }
        error_message: { type: [string, 'null'] }
        normalized_response: { type: object, additionalProperties: true }
        raw_response: { type: object, additionalProperties: true }
        changes: { type: array, items: { $ref: '#/components/schemas/Change' } }
        assertion_results: { type: array, items: { type: object, additionalProperties: true } }
        diagnostics: { type: object, additionalProperties: true }
    RunResponse: { type: object, properties: { data: { $ref: '#/components/schemas/Run' } } }
    RunCollection: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Run' } }, pagination: { $ref: '#/components/schemas/Pagination' } } }
    Change:
      type: object
      required: [path, type, severity]
      properties:
        path: { type: string, examples: ['organic_results[].price'] }
        type: { type: string, enum: [FIELD_ADDED, FIELD_REMOVED, TYPE_CHANGED, VALUE_CHANGED, ARRAY_LENGTH_CHANGED, RESULT_ORDER_CHANGED] }
        previous: {}
        current: {}
        severity: { type: string, enum: [info, warning, critical] }
    Incident:
      type: object
      properties:
        id: { type: string }
        monitor_id: { type: string }
        search_run_id: { type: string }
        incident_type: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string }
        description: { type: [string, 'null'] }
        path: { type: [string, 'null'] }
        previous_value: {}
        current_value: {}
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        occurrence_count: { type: integer }
        status: { type: string, enum: [open, acknowledged, resolved] }
        metadata: { type: object, additionalProperties: true }
    IncidentResponse: { type: object, properties: { data: { $ref: '#/components/schemas/Incident' } } }
    IncidentCollection: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Incident' } }, pagination: { $ref: '#/components/schemas/Pagination' } } }
    MetricsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            window: { type: string }
            request_count: { type: integer }
            success_rate: { type: number }
            failure_rate: { type: number }
            average_latency_ms: { type: number }
            p50_latency_ms: { type: number }
            p95_latency_ms: { type: number }
            p99_latency_ms: { type: number }
            average_result_count: { type: number }
            schema_changes: { type: integer }
            incident_count: { type: integer }
    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string, enum: [ok, degraded] }
            dependencies: { type: object, additionalProperties: { type: string } }
            timestamp: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string, examples: [INVALID_MONITOR] }
            message: { type: string }
            details: { type: object, additionalProperties: true }
