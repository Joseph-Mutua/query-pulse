name: CI

on:
  push:
  pull_request:

jobs:
  rails:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RAILS_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/query_pulse_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SEARCH_PROVIDER: fake
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec brakeman --no-pager
      - run: bundle exec rspec

  browser-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-worker/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx eslint src tests
      - run: npx prettier --check .
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: browser-worker/playwright-report
          retention-days: 7
